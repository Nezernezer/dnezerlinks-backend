<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Money | Dnezerlinks</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; }

    /* Top Alert Banner */
    #top-alert-banner {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        width: 90%;
        max-width: 400px;
        padding: 14px 20px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        display: none;
        animation: fadeIn 0.3s ease-in-out;
    }
    #top-alert-banner.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
    #top-alert-banner.error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

    .header { background: linear-gradient(180deg, #1565C0 0%, #0D47A1 100%); color: white; text-align: center; padding: 28px 20px 24px; }
    .header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 0.95rem; opacity: 0.9; }
    .container { max-width: 420px; margin: -20px auto 40px; padding: 0 16px; position: relative; z-index: 10; }
    .card { background: white; border-radius: 16px; padding: 28px 22px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border: 1px solid #f0f0f0; }
    .card h2 { text-align: center; color: #0D47A1; font-size: 1.35rem; margin-bottom: 24px; font-weight: 700; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 6px; margin-top: 14px; }
    input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid #e0e0e0; font-size: 1rem; transition: border-color 0.2s; background: #fafafa; }
    input:focus { outline: none; border-color: #1565C0; background: white; }
    .btn { width: 100%; padding: 15px; border: none; border-radius: 40px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: all 0.25s; margin-top: 18px; }
    .btn-primary { background: #FFB300; color: white; box-shadow: 0 4px 15px rgba(255, 179, 0, 0.35); }
    .btn-primary:hover:not(:disabled) { background: #ffa000; transform: translateY(-1px); }
    .btn-primary:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
    .btn-secondary { background: #0D47A1; color: white; }
    .btn-secondary:hover:not(:disabled) { background: #1565C0; }
    .name-box { margin-top: 14px; padding: 14px; border-radius: 12px; background: #e3f2fd; color: #0D47A1; font-weight: 600; font-size: 0.95rem; display: none; text-align: center; }
    .name-box.error { background: #ffebee; color: #c62828; }
    .name-box.show { display: block; }
    .balance-info { text-align: center; margin-bottom: 18px; font-size: 0.9rem; color: #666; }
    .balance-info span { font-weight: 700; color: #0D47A1; }
    .loading { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-note { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #888; }

    /* Modal Styling */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .dialog-box { background: #fff; border-radius: 15px; width: 85%; max-width: 400px; padding: 20px; box-sizing: border-box; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); animation: fadeIn 0.2s ease-out; }
</style>
</head>
<body>

<!-- Top Alert Banner Container -->
<div id="top-alert-banner"></div>

<!-- Polite Dialog Modal for Missing Transaction PIN -->
<div class="modal-overlay" id="customPromptModal">
    <div class="dialog-box">
        <h3 style="color: #0D47A1; margin-bottom: 10px;">Transaction PIN Required</h3>
        <p style="font-size: 0.95rem; color: #555; line-height: 1.4; margin-bottom: 20px;">
            You have not set up your transaction PIN yet. Would you like to set it up now to proceed with your transaction?
        </p>
        <button onclick="redirectToPinSetup()" style="background: #0D47A1; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px;">Yes</button>
        <button onclick="closeCustomPrompt()" style="background: #f44336; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">No</button>
    </div>
</div>

<div class="header">
    <h1>Dnezerlinks</h1>
    <p>Send Money to any Dlinks user</p>
</div>

<div class="container">
    <div class="card">
        <h2>Transfer Funds</h2>

        <div class="balance-info" id="balanceInfo">
            Your balance: <span id="userBalance">Loading...</span>
        </div>

        <label for="email">Recipient Email Address</label>
        <input type="email" id="email" placeholder="e.g. user@example.com">

        <button class="btn btn-secondary" id="searchBtn" onclick="searchUser()">
            Verify Recipient
        </button>

        <div id="nameResult" class="name-box"></div>

        <label for="amount">Amount (₦)</label>
        <input type="number" id="amount" placeholder="Enter amount" min="1" step="1">

        <label for="pin">Transaction PIN</label>
        <input type="password" id="pin" placeholder="Enter transaction PIN" maxlength="6">           
        <button class="btn btn-primary" id="sendBtn" onclick="handleSendMoneyClick()" disabled>
            Send Money
        </button>

        <p class="footer-note">Transfers are instant & secure via Dlinks</p>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAXWh3ls4yEANmGy4g7xZ8jlBN0KoFC5yc",
    authDomain: "dnezerlinks.firebaseapp.com",
    databaseURL: "https://dnezerlinks-default-rtdb.firebaseio.com",
    projectId: "dnezerlinks",
    appId: "1:1028450580168:web:d7a48462a128f02aa657fd"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const BACKEND_URL = "https://api.dlinks.name.ng";                                                    
let verifiedEmail = null;
let currentUser = null;                                                                              

function showTopAlert(message, type = 'success') {
    const alertBox = document.getElementById('top-alert-banner');
    alertBox.className = type;
    alertBox.textContent = message;
    alertBox.style.display = 'block';

    setTimeout(() => {
        alertBox.style.display = 'none';
    }, 4000);
}

document.getElementById("email").addEventListener("input", () => {
    verifiedEmail = null;
    document.getElementById("sendBtn").disabled = true;
    const nameBox = document.getElementById("nameResult");
    nameBox.className = "name-box";
    nameBox.style.display = "none";
});

auth.onAuthStateChanged((user) => {
    if (!user) {
        document.getElementById("balanceInfo").innerHTML = '<span style="color:#c62828">Please login first</span>';
        currentUser = null;
        return;
    }
    currentUser = user;

    db.ref(`users/${user.uid}/balance`).on('value', (snap) => {
        const balance = parseFloat(snap.val() || 0);
        document.getElementById("userBalance").innerText = "₦" + balance.toLocaleString(undefined, {minimumFractionDigits: 2});
    });
});

async function searchUser() {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const nameBox = document.getElementById("nameResult");                                               
    const searchBtn = document.getElementById("searchBtn");                                              
    const sendBtn = document.getElementById("sendBtn");

    if (!email || !email.includes("@")) {
        showTopAlert("Enter a valid email address", "error");
        nameBox.className = "name-box show error";
        nameBox.style.display = "block";
        nameBox.textContent = "Enter a valid email address";
        verifiedEmail = null;                                                                                
        sendBtn.disabled = true;
        return;
    }

    searchBtn.disabled = true;
    searchBtn.innerHTML = '<span class="loading"></span> Checking...';
    nameBox.style.display = "none";                                                                      
    verifiedEmail = null;
    sendBtn.disabled = true;

    try {
        let token = "";
        if (currentUser) {
            token = await currentUser.getIdToken().catch(() => "");
        }

        const res = await fetch(`${BACKEND_URL}/api/sendmoney/search-user`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...(token ? { "Authorization": `Bearer ${token}` } : {})
            },
            body: JSON.stringify({ email })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.success) {
            verifiedEmail = data.email || email;
            nameBox.className = "name-box show";
            nameBox.style.display = "block";                                                                     
            nameBox.textContent = "✓ " + (data.name || "Dlinks User");
            sendBtn.disabled = false;                                                                        
        } else {                                                                                                 
            const errMsg = data.message || data.error || "User not found";
            showTopAlert(errMsg, "error");
            nameBox.className = "name-box show error";
            nameBox.style.display = "block";
            nameBox.textContent = errMsg;
            verifiedEmail = null;                                                                                
            sendBtn.disabled = true;                                                                         
        }
    } catch (err) {
        showTopAlert("Network error during verification.", "error");
        nameBox.className = "name-box show error";
        nameBox.style.display = "block";
        nameBox.textContent = "Network error. Try again.";
        verifiedEmail = null;
        sendBtn.disabled = true;
    }

    searchBtn.disabled = false;
    searchBtn.textContent = "Verify Recipient";
}

async function handleSendMoneyClick() {
    if (!currentUser) {
        showTopAlert("Please login first.", "error");
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return;
    }

    try {
        const snapshot = await db.ref(`users/${currentUser.uid}`).once('value');
        const userData = snapshot.val() || {};
        if (!userData.transaction_pin && !userData.pin) {
            document.getElementById('customPromptModal').style.display = 'flex';
            return;
        }
    } catch (e) {
        console.error("Error checking transaction PIN:", e);
    }

    sendMoney();
}

function redirectToPinSetup() {
    window.location.href = "../pinsetup.html?return=sendmoney";
}

function closeCustomPrompt() {
    document.getElementById('customPromptModal').style.display = 'none';
}

async function sendMoney() {
    const amount = parseFloat(document.getElementById("amount").value);
    const pin = document.getElementById("pin").value.trim();
    const sendBtn = document.getElementById("sendBtn");

    if (!verifiedEmail) {
        showTopAlert("Please verify recipient first", "error");
        return;
    }
    if (!amount || amount <= 0 || !Number.isFinite(amount)) {
        showTopAlert("Enter a valid amount", "error");
        return;                                                                                          
    }
    if (!pin) {                                                                                              
        showTopAlert("Transaction PIN is required", "error");
        return;
    }

    if (!confirm(`Send ₦${amount.toLocaleString()} to the verified recipient?`)) {
        return;                                                                                          
    }

    sendBtn.disabled = true;
    sendBtn.innerHTML = '<span class="loading"></span> Processing...';                               

    try {
        const token = await currentUser.getIdToken().catch(() => "");

        const res = await fetch(`${BACKEND_URL}/api/sendmoney/transfer`, {                                       
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...(token ? { "Authorization": `Bearer ${token}` } : {})
            },
            body: JSON.stringify({
                email: verifiedEmail,                                                                                
                amount: amount,
                pin: pin
            })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && (data.success === true || data.success === "true")) {
            showTopAlert(data.message || `✓ Transfer successful!`, "success");
            document.getElementById("amount").value = "";
            document.getElementById("pin").value = "";
            verifiedEmail = null;
            document.getElementById("sendBtn").disabled = true;
            document.getElementById("nameResult").className = "name-box";
            document.getElementById("nameResult").style.display = "none";
        } else {
            const errMsg = data.message || data.error || "Transfer failed";
            showTopAlert(errMsg, "error");
        }
    } catch (err) {
        showTopAlert("Network error. Please try again.", "error");
    }

    sendBtn.disabled = false;                                                                            
    sendBtn.textContent = "Send Money";
}
</script>
</body>
</html>
