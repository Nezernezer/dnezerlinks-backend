<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Role Management | Dnezerlinks</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        :root { --primary: #0d47a1; --accent: #ffab00; --bg: #f4f7f6; --success: #2e7d32; --dark: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; }
        
        /* Restored Header Design */
        .brand-header { background: linear-gradient(135deg, var(--primary) 0%, #1565c0 100%); color: white; padding: 18px 20px; box-shadow: 0 4px 12px rgba(13, 71, 161, 0.25); flex-shrink: 0; }
        .back-hub-btn { color: rgba(255, 255, 255, 0.9); text-decoration: none; font-weight: 600; font-size: 13px; background: rgba(255, 255, 255, 0.15); padding: 6px 14px; border-radius: 20px; }
        
        .content-area { padding: 20px 15px; flex-grow: 1; overflow-y: auto; }
        .user-card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        
        /* Compact Grid */
        .matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .role-option { display: flex; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: 600; color: #475569; }
        .role-option.active-role { background: #e8f5e9; border-color: #a5d6a7; color: var(--success); }
        .role-option input { margin-right: 4px; }
        
        .btn-action { width: 100%; padding: 6px; border-radius: 6px; border: none; cursor: pointer; font-size: 10px; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="brand-header">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <a href="index.html" class="back-hub-btn">← Admin Hub</a>
            <span id="authStatus" style="font-size:10px; font-weight:700;">Verifying...</span>
        </div>
        <h1 style="margin:0; font-size:1.4rem;">Dnezer<span style="color:var(--accent)">links</span></h1>
        <input type="text" id="searchInput" placeholder="Search operators..." onkeyup="filterUsers()" style="width:100%; padding:10px; margin-top:12px; border-radius:8px; border:none;">
    </div>

    <div class="content-area" id="usersContainer">Loading structural security registers...</div>
</div>

<script>
    const config = {
        apiKey: "AIzaSyAXWh3ls4yEANmGy4g7xZ8jlBN0KoFC5yc",
        authDomain: "dnezerlinks.firebaseapp.com",
        databaseURL: "https://dnezerlinks-default-rtdb.firebaseio.com",
        projectId: "dnezerlinks"
    };
    firebase.initializeApp(config);
    const db = firebase.database();
    const auth = firebase.auth();

    const AVAILABLE_ROLES = [
        { id: 'isMaster', label: 'Master' }, { id: 'canVerifyKyc', label: 'KYC' },
        { id: 'canManageWallets', label: 'Wallet' }, { id: 'canBroadcast', label: 'Broadcast' },
        { id: 'canViewHistory', label: 'Audit' }, { id: 'canDeleteUsers', label: 'Delete' },
        { id: 'canResetPin', label: 'PIN' }, { id: 'canResetPassword', label: 'Pass' },
        { id: 'canResetProfile', label: 'Profile' }, { id: 'canResetKyc', label: 'ResetKYC' },
        { id: 'canBlockUsers', label: 'Block' }
    ];

    auth.onAuthStateChanged(user => {
        if (!user) window.location.href = "../login.html";
        else {
            document.getElementById('authStatus').innerText = "Session Active ●";
            startLiveSync();
        }
    });

    function startLiveSync() {
        db.ref('users').on('value', uSnap => {
            db.ref('admin_roles').on('value', rSnap => render(uSnap.val() || {}, rSnap.val() || {}));
        });
    }

    function render(users, allRoles) {
        const container = document.getElementById('usersContainer');
        const currentAdmin = auth.currentUser.uid;
        const adminRoles = allRoles[currentAdmin] || {};
        container.innerHTML = "";

        Object.keys(users).forEach(uid => {
            const u = users[uid];
            const uRoles = allRoles[uid] || {};
            
            let checkboxHtml = AVAILABLE_ROLES.map(role => `
                <label class="role-option ${uRoles[role.id] ? 'active-role' : ''}">
                    <input type="checkbox" ${uRoles[role.id] ? 'checked' : ''} onchange="togglePrivilege('${uid}', '${role.id}', this.checked)">
                    ${role.label}
                </label>
            `).join('');

            container.innerHTML += `
                <div class="user-card" data-search="${(u.name || '').toLowerCase()}">
                    <b style="font-size:13px;">${u.name || 'User'}</b><br><small style="font-size:9px; color:#999;">${uid}</small>
                    <div class="matrix-grid">${checkboxHtml}</div>
                    ${adminRoles.canDeleteUsers ? `<button class="btn-action" style="background:#fee2e2; color:red;" onclick="deleteUser('${uid}')">DELETE</button>` : ''}
                </div>`;
        });
    }

    async function togglePrivilege(uid, roleId, val) { await db.ref(`admin_roles/${uid}/${roleId}`).set(val); }
    async function deleteUser(uid) { if (confirm("Confirm permanent deletion?")) await db.ref('users/' + uid).remove(); }

    function filterUsers() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.user-card').forEach(c => {
            c.style.display = c.getAttribute('data-search').includes(term) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
