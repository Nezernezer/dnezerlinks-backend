<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill - Dnezerlinks</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        :root { --primary: #0d47a1; --accent: #ffab00; }
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: #f4f4f4; display: flex; justify-content: center; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 420px; width: 100%; }
        h2 { color: var(--primary); margin-bottom: 20px; text-align: center; }
        label { font-size: 14px; font-weight: 600; color: #555; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0 16px 0; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        button { background: var(--primary); color: white; font-weight: bold; border: none; cursor: pointer; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-print { background: #2e7d32; }
        .btn-new { background: #546e7a; }
        .status-msg { padding: 10px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; display: none; font-size: 14px; }
        .status-loading { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .back-link { display: block; text-align: center; color: #666; text-decoration: none; font-size: 14px; margin-top: 10px; }

        /* Receipt */
        #paymentForm { display: block; }
        #receiptCard { display: none; }
        .receipt {
            border: 1px dashed #999;
            padding: 18px;
            border-radius: 8px;
            background: #fafafa;
            margin-bottom: 15px;
        }
        .receipt-header { text-align: center; margin-bottom: 12px; }
        .receipt-header h3 { margin: 0; color: var(--primary); }
        .receipt-header p { margin: 4px 0; font-size: 13px; color: #555; }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .receipt-row span:first-child { color: #666; }
        .receipt-row span:last-child { font-weight: 700; text-align: right; max-width: 60%; word-break: break-word; }
        .token-box {
            margin-top: 12px;
            padding: 12px;
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            text-align: center;
        }
        .token-box strong { display: block; font-size: 18px; letter-spacing: 1px; margin-top: 6px; word-break: break-all; }

        @media print {
            body * { visibility: hidden; }
            #receiptCard, #receiptCard * { visibility: visible; }
            #receiptCard {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <!-- PAYMENT FORM -->
    <div class="card" id="paymentForm">
        <h2>💡 Electricity Bill</h2>

        <label>Select Disco</label>
        <select id="disco" onchange="checkAndValidate()">
            <option value="">-- Choose Disco --</option>
            <option value="IKEDC">IKEDC (Ikeja)</option>
            <option value="EKEDC">EKEDC (Eko)</option>
            <option value="KEDCO">KEDCO (Kano)</option>
            <option value="PHEDC">PHEDC (Port Harcourt)</option>
            <option value="JEDC">JEDC (Jos)</option>
            <option value="IBEDC">IBEDC (Ibadan)</option>
            <option value="KAEDCO">KAEDCO (Kaduna)</option>
            <option value="AEDC">AEDC (Abuja)</option>
            <option value="BEDC">BEDC (Benin)</option>
            <option value="EEDC">EEDC (Enugu)</option>
            <option value="YEDC">YEDC (Yola)</option>
        </select>

        <label>Meter Type</label>
        <select id="meterType">
            <option value="Prepaid">Prepaid</option>
            <option value="Postpaid">Postpaid</option>
        </select>

        <label>Meter Number</label>
        <input type="text" id="meterNum" placeholder="Enter Meter Number" oninput="checkAndValidate()" inputmode="numeric">

        <div id="statusBox" class="status-msg"></div>

        <label>Amount (₦)</label>
        <input type="number" id="amount" placeholder="Min ₦1,000" min="1000">

        <label>Transaction PIN</label>
        <input type="password" id="pin" placeholder="Enter 4-digit PIN" maxlength="6" inputmode="numeric">

        <button id="payBtn" onclick="processElectricity()" disabled>Pay Bill Now</button>
        <a href="../home.html" class="back-link">← Back to Dashboard</a>
    </div>

    <!-- PRINTABLE RECEIPT -->
    <div class="card" id="receiptCard">
        <div class="receipt" id="receiptContent">
            <div class="receipt-header">
                <h3>Dnezerlinks</h3>
                <p>Electricity Payment Receipt</p>
                <p id="rDate">—</p>
            </div>

            <div class="receipt-row"><span>Status</span><span style="color:#2e7d32;">SUCCESSFUL</span></div>
            <div class="receipt-row"><span>Customer</span><span id="rCustomer">—</span></div>
            <div class="receipt-row"><span>Disco</span><span id="rDisco">—</span></div>
            <div class="receipt-row"><span>Meter Type</span><span id="rType">—</span></div>
            <div class="receipt-row"><span>Meter Number</span><span id="rMeter">—</span></div>
            <div class="receipt-row"><span>Amount</span><span id="rAmount">—</span></div>
            <div class="receipt-row"><span>Reference</span><span id="rRef">—</span></div>

            <div class="token-box" id="tokenBox" style="display:none;">
                <span>Electricity Token</span>
                <strong id="rToken">—</strong>
            </div>

            <p style="text-align:center;font-size:12px;color:#888;margin-top:14px;">
                Thank you for using Dnezerlinks
            </p>
        </div>

        <button class="btn-print no-print" onclick="window.print()">🖨️ Print Receipt</button>
        <button class="btn-new no-print" onclick="newPayment()">New Payment</button>
        <a href="../home.html" class="back-link no-print">← Back to Dashboard</a>
    </div>

    <script>
        const API_BASE = 'https://dnezerlinks-backend.onrender.com';

        const firebaseConfig = {
            apiKey: "AIzaSyAXWh3ls4yEANmGy4g7xZ8jlBN0KoFC5yc",
            authDomain: "dnezerlinks.firebaseapp.com",
            databaseURL: "https://dnezerlinks-default-rtdb.firebaseio.com",
            projectId: "dnezerlinks",
            appId: "1:1028450580168:web:d7a48462a128f02aa657fd"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let verifiedCustomerName = "";
        let lastValidatedNumber = "";

        function checkAndValidate() {
            const disco = document.getElementById('disco').value;
            const meterNumber = String(document.getElementById('meterNum').value || "").trim();
            const payBtn = document.getElementById('payBtn');
            const statusBox = document.getElementById('statusBox');

            if (meterNumber.length < 8) {
                payBtn.disabled = true;
                statusBox.style.display = "none";
                verifiedCustomerName = "";
                lastValidatedNumber = "";
                return;
            }

            const validationKey = `\( {disco}_ \){meterNumber}`;
            if (validationKey !== lastValidatedNumber) {
                if (!disco) {
                    showStatus("❌ Please select a Disco first.", "status-error");
                    payBtn.disabled = true;
                    return;
                }
                lastValidatedNumber = validationKey;
                executeAutoValidation(meterNumber, disco);
            }
        }

        async function executeAutoValidation(meterNumber, disco) {
            const payBtn = document.getElementById('payBtn');
            showStatus("⏳ Validating meter account details...", "status-loading");
            payBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/electricity/validate-meter`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ meterNumber, disco })
                });

                const text = await response.text();
                console.log('VALIDATE RAW:', response.status, text);

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    showStatus("❌ API returned HTML instead of JSON. Check API_BASE.", "status-error");
                    payBtn.disabled = true;
                    return;
                }

                if (response.ok && data.status === 'success' && data.customer) {
                    verifiedCustomerName = data.customer;
                    showStatus(`👤 Customer: ${verifiedCustomerName}`, "status-success");
                    payBtn.disabled = false;
                } else {
                    verifiedCustomerName = "";
                    showStatus(`❌ ${data.error || 'Invalid meter detail'}`, "status-error");
                    payBtn.disabled = true;
                }
            } catch (err) {
                console.error(err);
                showStatus(`❌ ${err.message}`, "status-error");
                payBtn.disabled = true;
            }
        }

        function showStatus(text, className) {
            const statusBox = document.getElementById('statusBox');
            statusBox.className = `status-msg ${className}`;
            statusBox.innerText = text;
            statusBox.style.display = "block";
        }

        function showReceipt(payload) {
            document.getElementById('rDate').innerText = payload.date || new Date().toLocaleString();
            document.getElementById('rCustomer').innerText = verifiedCustomerName || '—';
            document.getElementById('rDisco').innerText = payload.disco || '—';
            document.getElementById('rType').innerText = payload.meterType || '—';
            document.getElementById('rMeter').innerText = payload.meterNumber || '—';
            document.getElementById('rAmount').innerText = '₦' + Number(payload.amount || 0).toLocaleString();
            document.getElementById('rRef').innerText = payload.reference || '—';

            if (payload.token) {
                document.getElementById('tokenBox').style.display = 'block';
                document.getElementById('rToken').innerText = payload.token;
            } else {
                document.getElementById('tokenBox').style.display = 'none';
            }

            document.getElementById('paymentForm').style.display = 'none';
            document.getElementById('receiptCard').style.display = 'block';
        }

        function newPayment() {
            document.getElementById('receiptCard').style.display = 'none';
            document.getElementById('paymentForm').style.display = 'block';
            document.getElementById('payBtn').disabled = true;
            document.getElementById('payBtn').innerText = 'Pay Bill Now';
            document.getElementById('amount').value = '';
            document.getElementById('pin').value = '';
            document.getElementById('meterNum').value = '';
            document.getElementById('statusBox').style.display = 'none';
            verifiedCustomerName = '';
            lastValidatedNumber = '';
        }

        async function processElectricity() {
            const disco = document.getElementById('disco').value;
            const meterType = document.getElementById('meterType').value;
            const meterNum = document.getElementById('meterNum').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const pin = document.getElementById('pin').value.trim();
            const payBtn = document.getElementById('payBtn');
            const user = auth.currentUser;

            if (!user) { alert('Please login first.'); return; }
            if (!pin) { alert('❌ Enter your transaction PIN.'); return; }
            if (isNaN(amount) || amount < 1000) { alert('❌ Minimum payment amount is ₦1,000.'); return; }
            if (!verifiedCustomerName) { alert('❌ Please validate meter first.'); return; }

            const confirmMsg = `CONFIRM PAYMENT\n\n👤 Name: ${verifiedCustomerName}\n🏢 Disco: ${disco}\n⚡ Type: ${meterType}\n🔢 Meter: \( {meterNum}\n💰 Amount: ₦ \){amount.toLocaleString()}\n\nProceed?`;
            if (!confirm(confirmMsg)) return;

            payBtn.disabled = true;
            payBtn.innerText = 'Processing Transaction...';

            try {
                const response = await fetch(`${API_BASE}/api/electricity/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        uid: user.uid,
                        pin: pin,
                        meterNumber: meterNum,
                        amount: amount,
                        tokenType: meterType,
                        disco: disco
                    })
                });

                const text = await response.text();
                console.log('PAY RAW:', response.status, text);

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    alert('❌ API returned HTML instead of JSON. Check API_BASE.');
                    payBtn.disabled = false;
                    payBtn.innerText = 'Pay Bill Now';
                    return;
                }

                if (response.ok && data.success) {
                    showReceipt({
                        customer: verifiedCustomerName,
                        disco: data.disco || disco,
                        meterType: data.meterType || meterType,
                        meterNumber: data.meterNumber || meterNum,
                        amount: data.amount || amount,
                        reference: data.reference || '',
                        token: data.token || null,
                        date: data.date || new Date().toLocaleString()
                    });
                } else {
                    alert(`❌ Payment Failed: ${data.error || 'Unknown error'}`);
                    payBtn.disabled = false;
                    payBtn.innerText = 'Pay Bill Now';
                }
            } catch (err) {
                console.error(err);
                alert('❌ Gateway communication error: ' + err.message);
                payBtn.disabled = false;
                payBtn.innerText = 'Pay Bill Now';
            }
        }
    </script>
</body>
</html>
