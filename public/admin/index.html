<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Hub | Dnezerlinks</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #0d47a1; --accent: #ffab00; --bg: #f4f7f6; }
        body { font-family: sans-serif; text-align: center; padding: 20px; background: var(--bg); margin: 0; }
        .status-header { background: white; padding: 15px; border-radius: 12px; margin-bottom: 25px; }
        .grid { display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: auto; }
        .card { background: var(--primary); color: white; padding: 20px; border-radius: 12px; text-decoration: none; font-weight: bold; display: flex; align-items: center; justify-content: center; min-height: 60px; cursor: pointer; border: none; width: 100%; font-size: inherit; font-family: inherit; box-sizing: border-box; }
        .btn-wallet { background: var(--accent); color: black; }
        .btn-broadcast { background: #2e7d32; }
        .btn-history { background: #607d8b; }
        .btn-acts { background: #7c3aed; color: white; }
        .btn-exit { background: #444; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="status-header">
        <h1>Admin Command Hub</h1>
        <div id="adminStatus">Verifying...</div>
    </div>
    <div class="grid">
        <a href="users.html" id="nav-verifications" class="card" style="display: none;">Manage Verifications</a>
        <a href="wallet.html" id="nav-wallet" class="card btn-wallet" style="display: none;">Wallet Manager</a>
        <a href="broadcast.html" id="nav-broadcast" class="card btn-broadcast" style="display: none;">Broadcast & Marquee</a>
        <a href="history.html" id="nav-history" class="card btn-history" style="display: none;">Transaction History</a>
        <a href="adminroles.html" id="nav-roles" class="card btn-wallet" style="display: none;">Admin Privileges</a>
        <a href="audit.html" id="nav-audit" class="card btn-history" style="background: #e91e63; display: none;">Audit History</a>
        <button id="nav-acts" class="card btn-acts" style="display: none;" onclick="window.location.href='adminactivity.html'">Admin Acts</button>
        <a href="../home.html" class="card btn-exit">Exit Admin</a>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyAXWh3ls4yEANmGy4g7xZ8jlBN0KoFC5yc",
            authDomain: "dnezerlinks.firebaseapp.com",
            databaseURL: "https://dnezerlinks-default-rtdb.firebaseio.com",
            projectId: "dnezerlinks"
        };
        firebase.initializeApp(config);
        const db = firebase.database();
        const auth = firebase.auth();
        const MASTER_UID = "VCSNLSzYV2WsNG93mPE2ZtwdTna2";

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "../login.html"; return; }

            db.ref(`admin_roles/${user.uid}`).once('value').then(snap => {
                const roles = snap.val() || {};
                const isMaster = (user.uid === MASTER_UID);

                if (isMaster || Object.keys(roles).length > 0) {
                    document.getElementById('adminStatus').innerText = "● ACCESS GRANTED";
                    document.getElementById('nav-verifications').style.display = (isMaster || roles.canVerifyKyc) ? 'flex' : 'none';
                    document.getElementById('nav-wallet').style.display = (isMaster || roles.canManageWallets) ? 'flex' : 'none';
                    document.getElementById('nav-broadcast').style.display = (isMaster || roles.canBroadcast) ? 'flex' : 'none';
                    document.getElementById('nav-history').style.display = (isMaster || roles.canVerifyKyc || roles.canManageWallets || roles.canBroadcast) ? 'flex' : 'none';
                    document.getElementById('nav-roles').style.display = isMaster ? 'flex' : 'none';
                    document.getElementById('nav-audit').style.display = isMaster ? 'flex' : 'none';
                    document.getElementById('nav-acts').style.display = isMaster ? 'flex' : 'none';
                } else {
                    window.location.href = "../home.html";
                }
            });
        });
    </script>
</body>
</html>
