<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill - Dnezerlinks</title>
    <style>
        :root { --primary: #0d47a1; --accent: #ffab00; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
        }

        .card {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        h2 { color: var(--primary); margin-bottom: 20px; text-align: center; font-size: 1.5rem; }

        label { font-size: 14px; font-weight: 600; color: #555; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 1rem; outline: none; }
        
        button { 
            width: 100%; 
            padding: 15px; 
            background: var(--primary); 
            color: white; 
            font-weight: bold; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 25px; 
            font-size: 1rem;
            transition: background 0.3s; 
        }
        button:active { background: #1565c0; transform: scale(0.98); }
        button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }

        .status-msg { padding: 12px; border-radius: 8px; font-weight: 500; margin-bottom: 15px; display: none; font-size: 0.9rem; text-align: center; }
        .status-loading { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .back-link { display: block; text-align: center; color: var(--primary); text-decoration: none; font-size: 14px; margin-top: 20px; font-weight: bold; }

        #customPromptModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        @media (max-width: 360px) {
            .card { padding: 15px; }
            body { padding-top: 10px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>💡 Electricity Bill</h2>

        <label>Select Disco</label>
        <select id="disco" onchange="checkAndValidate()">
            <option value="">-- Choose Disco --</option>
            <option value="IKEDC">IKEDC (Ikeja)</option>
            <option value="EKEDC">EKEDC (Eko)</option>
            <option value="KEDCO">KEDCO (Kano)</option>
            <option value="PHEDC">PHEDC (Port Harcourt)</option>
            <option value="JEDC">JEDC (Jos)</option>
            <option value="IBEDC">IBEDC (Ibadan)</option>
            <option value="KAEDCO">KAEDCO (Kaduna)</option>
            <option value="AEDC">AEDC (Abuja)</option>
            <option value="BEDC">BEDC (Benin)</option>
            <option value="EEDC">EEDC (Enugu)</option>
            <option value="YEDC">YEDC (Yola)</option>
        </select>

        <label>Meter Type</label>
        <select id="meterType">
            <option value="Prepaid">Prepaid</option>
            <option value="Postpaid">Postpaid</option>
        </select>

        <label>Meter Number</label>
        <input type="text" id="meterNum" placeholder="Enter Meter Number" oninput="checkAndValidate()" inputmode="numeric">

        <div id="statusBox" class="status-msg"></div>

        <label>Amount (₦)</label>
        <input type="number" id="amount" placeholder="Enter Amount">

        <label>Transaction PIN</label>
        <input type="password" id="pin" placeholder="Enter 4-digit PIN" maxlength="6" inputmode="numeric">

        <button id="payBtn" onclick="validateUserAndPay()" disabled>Pay Bill Now</button>
        <a href="../home.html" class="back-link">← Back to Dashboard</a>
    </div>

    <!-- Polite Dialog Modal for Missing Transaction PIN -->
    <div id="customPromptModal">
        <div class="modal-content">
            <h3 style="color: var(--primary); margin-bottom: 10px; margin-top: 0;">Transaction PIN Required</h3>
            <p style="font-size: 0.95rem; color: #555; line-height: 1.4; margin-bottom: 20px;">
                You have not set up your transaction PIN yet. Would you like to set it up now to proceed with your transaction?
            </p>
            <button onclick="redirectToPinSetup()" style="background: var(--primary); color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 0; margin-bottom: 10px;">Yes</button>
            <button onclick="closeCustomPrompt()" style="background: #f44336; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 0;">No</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const API_BASE = 'https://dnezerlinks-backend.onrender.com';
        const firebaseConfig = {
            apiKey: "AIzaSyAXWh3ls4yEANmGy4g7xZ8jlBN0KoFC5yc",
            authDomain: "dnezerlinks.firebaseapp.com",
            databaseURL: "https://dnezerlinks-default-rtdb.firebaseio.com",
            projectId: "dnezerlinks",
            appId: "1:1028450580168:web:d7a48462a128f02aa657fd"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let verifiedCustomerName = "";
        let lastValidatedNumber = "";

        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = "../login.html";
        });

        function checkAndValidate() {
            const disco = document.getElementById('disco').value;
            const meterNumber = String(document.getElementById('meterNum').value || "").trim();
            const payBtn = document.getElementById('payBtn');
            const statusBox = document.getElementById('statusBox');

            if (meterNumber.length < 8) {
                payBtn.disabled = true;
                statusBox.style.display = "none";
                verifiedCustomerName = "";
                lastValidatedNumber = "";
                return;
            }

            if (meterNumber.length >= 8) {
                const validationKey = `${disco}_${meterNumber}`;
                if (validationKey !== lastValidatedNumber) {
                    if (!disco) {
                        showStatus("❌ Please select a Disco first.", "status-error");
                        payBtn.disabled = true;
                        return;
                    }
                    lastValidatedNumber = validationKey;
                    executeAutoValidation(meterNumber, disco);
                }
            }
        }

        async function executeAutoValidation(meterNumber, disco) {
            const payBtn = document.getElementById('payBtn');
            showStatus("⏳ Validating meter account details...", "status-loading");
            payBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/electricity/validate-meter`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ meterNumber, disco })
                });

                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    showStatus("❌ API returned HTML instead of JSON. Check API_BASE URL.", "status-error");
                    payBtn.disabled = true;
                    return;
                }

                if (response.ok && data.status === 'success') {
                    verifiedCustomerName = data.customer;
                    showStatus(`👤 Customer: ${verifiedCustomerName}`, "status-success");
                    payBtn.disabled = false;
                } else {
                    showStatus(`❌ ${data.error || 'Invalid meter detail'}`, "status-error");
                    payBtn.disabled = true;
                }
            } catch (err) {
                console.error(err);
                showStatus(`❌ ${err.message}`, "status-error");
                payBtn.disabled = true;
            }
        }

        function showStatus(text, className) {
            const statusBox = document.getElementById('statusBox');
            statusBox.className = `status-msg ${className}`;
            statusBox.innerText = text;
            statusBox.style.display = "block";
        }

        async function validateUserAndPay() {
            const user = auth.currentUser;
            if (!user) {
                alert("Please login first.");
                return;
            }

            const payBtn = document.getElementById('payBtn');
            payBtn.disabled = true;
            payBtn.innerText = "Checking status...";

            try {
                const snap = await database.ref('users/' + user.uid).once('value');
                const data = snap.val() || {};

                if (!data.transaction_pin && !data.pin) {
                    document.getElementById('customPromptModal').style.display = 'flex';
                    return;
                }

                await processElectricity();

            } catch (e) {
                alert("Error validating account.");
            } finally {
                payBtn.disabled = false;
                payBtn.innerText = "Pay Bill Now";
            }
        }

        function redirectToPinSetup() {
            window.location.href = "../pinsetup.html?return=electricity";
        }

        function closeCustomPrompt() {
            document.getElementById('customPromptModal').style.display = 'none';
        }

        async function processElectricity() {
            const disco = document.getElementById('disco').value;
            const meterType = document.getElementById('meterType').value;
            const meterNum = document.getElementById('meterNum').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const pin = document.getElementById('pin').value.trim();
            const payBtn = document.getElementById('payBtn');
            const user = auth.currentUser;

            if (!pin) {
                alert("❌ Enter your transaction PIN.");
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                alert("❌ Please enter a valid amount.");
                return;
            }
            if (!verifiedCustomerName) {
                alert("❌ Please validate meter first.");
                return;
            }

            const confirmMsg = `CONFIRM PAYMENT\n\n👤 Name: ${verifiedCustomerName}\n🏢 Disco: ${disco}\n⚡ Type: ${meterType}\n🔢 Meter: ${meterNum}\n💰 Amount: ₦${amount.toLocaleString()}\n\nProceed?`;
            if (!confirm(confirmMsg)) return;

            payBtn.disabled = true;
            payBtn.innerText = "Processing Transaction...";

            try {
                const response = await fetch(`${API_BASE}/api/electricity/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        uid: user.uid,
                        pin: pin,
                        meterNumber: meterNum,
                        amount: amount,
                        tokenType: meterType,
                        disco: disco
                    })
                });

                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    alert("❌ API returned HTML instead of JSON. Check API_BASE URL.");
                    payBtn.disabled = false;
                    payBtn.innerText = "Pay Bill Now";
                    return;
                }

                if (response.ok && data.success) {
                    alert(`✅ Payment Successful!\n${data.token ? 'Token: ' + data.token : ''}`);
                    window.location.href = "../home.html";
                } else {
                    alert(`❌ Payment Failed: ${data.error || 'Unknown error'}`);
                    payBtn.disabled = false;
                    payBtn.innerText = "Pay Bill Now";
                }
            } catch (err) {
                console.error(err);
                alert("❌ Gateway communication error: " + err.message);
                payBtn.disabled = false;
                payBtn.innerText = "Pay Bill Now";
            }
        }
    </script>
</body>
</html>
