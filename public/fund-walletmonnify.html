<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Wallet with Monnify - Dnezerlinks</title>
    <script type="text/javascript" src="https://sdk-v2.monnify.com/plugin/monnify.js"></script>
    <style>
        /* Shared Reset Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            gap: 30px;
        }

        /* COMPONENT 1: CONSTANT FUND WALLET FORM */
        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 { color: #0d47a1; text-align: center; margin-bottom: 10px; }
        .balance-box { background: #0d47a1; color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:read-only { background-color: #eee; }

        button { width: 100%; padding: 15px; background-color: #0d47a1; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .progress-container { width: 100%; background: #eee; height: 4px; border-radius: 2px; margin-top: -10px; margin-bottom: 15px; display: none; overflow: hidden; }
        .progress-bar { width: 100%; height: 100%; background: #0d47a1; animation: loading 1.5s infinite linear; }
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .loader-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; color: #0d47a1; font-weight: bold; }

        /* COMPONENT 2: SWIPEABLE PAYMENT CHANNELS */
        .swipe-container {
            display: flex;
            gap: 20px;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .swipe-container::-webkit-scrollbar { display: none; }
        .swipe-container { -ms-overflow-style: none; scrollbar-width: none; }

        .card {
            flex: 0 0 100%;
            height: 160px;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            scroll-snap-align: start;
            transition: transform 0.3s ease;
        }

        .card:active { transform: scale(0.98); }
        .card-title { font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; text-transform: capitalize; }
        .card-body { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }

        .account-info-box {
            display: flex;
            flex-direction: column;
            gap: 1.5px;
            width: 70%;
            text-align: left;
            display: none;
        }

        .acc-number-text { font-size: 1.0rem; font-weight: bold; letter-spacing: 1px; }
        .acc-name-text {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btn {
            background-color: #ffffff;
            color: #333;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.80rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: background 0.2s ease;
            white-space: nowrap;
        }

        .action-btn:hover { background-color: #f1f5f9; }
        .action-btn:disabled { background-color: #cccccc; color: #666; cursor: not-allowed; box-shadow: none; }

        .bg-monnify1 { background: linear-gradient(135deg, #0d47a1, #1976d2); }
        .bg-monnify2 { background: linear-gradient(135deg, #2e7d32, #4caf50); }
        .bg-monnify3 { background: linear-gradient(135deg, #ff8f00, #ffc107); }

        .hint { text-align: center; color: #888; font-size: 0.9rem; margin-top: -10px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="loader" class="loader-overlay">
        <p>Processing Your Transaction...</p>
    </div>

    <div class="container">
        <button onclick="location.href='home.html'" style="border:none; background:none; color:#0d47a1; cursor:pointer; margin-bottom:10px; font-weight:bold;">⬅ Back Home</button>
        <h2>Fund Wallet (Monnify)</h2>
        
        <div class="balance-box">
            <span style="font-size: 0.9rem;">Wallet Balance</span><br>
            <span id="wallet-balance" style="font-size: 1.8rem; font-weight: bold;">₦0.00</span>
        </div>

        <form id="payForm">
            <label>User Email</label>
            <input type="email" id="email-address" readonly />

            <label>Amount (NGN)</label>
            <input type="number" id="amount" placeholder="Min 100" min="100" required />

            <div class="progress-container" id="payLoad"> <div class="progress-bar"></div> </div>

            <button type="submit" id="payBtn">Pay with Monnify SDK</button>
        </form>
    </div>

    <!-- Swipeable Options Showcase (Mirrors structural layout layout style) -->
    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="swipe-container">

            <!-- Card 1 -->
            <div class="card bg-monnify1">
                <div class="card-title">Monnify Card</div>
                <div class="card-body">
                    <div class="account-info-box" style="display: flex;">
                        <span class="acc-number-text">Instant Funding</span>
                        <span class="acc-name-text">Secure Gateway Checkout</span>
                    </div>
                    <button class="action-btn" onclick="document.getElementById('amount').focus()">Fund Now</button>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card bg-monnify2">
                <div class="card-title">Bank Transfer</div>
                <div class="card-body">
                    <div class="account-info-box" style="display: flex;">
                        <span class="acc-number-text">Automated Bank</span>
                        <span class="acc-name-text">Zero Downtime Deposit</span>
                    </div>
                    <button class="action-btn" onclick="document.getElementById('amount').focus()">Fund Now</button>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card bg-monnify3">
                <div class="card-title">USSD / Direct</div>
                <div class="card-body">
                    <div class="account-info-box" style="display: flex;">
                        <span class="acc-number-text">Quick USSD Code</span>
                        <span class="acc-name-text">Bank Code Interop</span>
                    </div>
                    <button class="action-btn" onclick="document.getElementById('amount').focus()">Fund Now</button>
                </div>
            </div>

        </div>
        <div class="hint">← Swipe or drag to view payment modes →</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXWh3ls4yEANmGy4g7xZ8jlBN0KoFC5yc",
            authDomain: "dnezerlinks.firebaseapp.com",
            databaseURL: "https://dnezerlinks-default-rtdb.firebaseio.com",
            projectId: "dnezerlinks",
            appId: "1:1028450580168:web:d7a48462a128f02aa657fd"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        let customerName = "Dnezerlinks Customer";
        let isVerified = false;

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('email-address').value = user.email;
                
                database.ref('users/' + user.uid).on('value', snap => {
                    const data = snap.val();
                    if (data) {
                        customerName = data.name || "User";
                        isVerified = data.kyc_status === "VERIFIED";
                        
                        document.getElementById("wallet-balance").innerText =
                            "₦" + parseFloat(data.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2});
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('payForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!isVerified) {
                alert("Please complete your KYC verification first.");
                window.location.href = "kyc_status.html";
                return;
            }

            const amount = parseFloat(document.getElementById('amount').value);
            const email = document.getElementById('email-address').value;
            const payBtn = document.getElementById('payBtn');
            const payLoad = document.getElementById('payLoad');
            const currentUser = auth.currentUser;

            if (!currentUser) return;

            payBtn.disabled = true;
            payBtn.innerText = "Initializing Gateway...";
            payLoad.style.display = 'block';

            MonnifySDK.initialize({
                amount: amount,
                currency: "NGN",
                reference: "DNEZ_" + Date.now(),
                customerFullName: customerName,
                customerEmail: email,
                apiKey: "MK_TEST_9LWZY7GU15",
                contractCode: "2057613223",
                paymentDescription: "Wallet Funding",
                metaData: {
                    userId: currentUser.uid
                },
                onComplete: function(response) {
                    payLoad.style.display = 'none';
                    if (response.status === 'SUCCESS' || response.paymentStatus === 'PAID') {
                        document.getElementById('loader').style.display = 'flex';
                        // Backend webhook securely handles the actual DB wallet updates
                        setTimeout(() => {
                            window.location.href = "paysuccess.html";
                        }, 2500);
                    } else {
                        window.location.href = "payfailed.html";
                    }
                },
                onClose: function() {
                    payBtn.disabled = false;
                    payBtn.innerText = "Pay with Monnify SDK";
                    payLoad.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
