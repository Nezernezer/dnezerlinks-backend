<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Subscription - Dnezerlinks</title>
    <style>
        :root { --primary: #007bff; }
        body, html { margin: 0; padding: 0; width: 100%; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 20px; }
        #mainContent { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }
        .card { width: 100%; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        h2 { color: var(--primary); text-align: center; margin: 0 0 20px 0; font-size: 1.5rem; }
        #statusMsg { padding: 12px; margin-bottom: 15px; border-radius: 8px; display: none; font-size: 0.9rem; text-align: center; font-weight: 500; }
        .error-msg { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .success-msg { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        label { font-weight: bold; margin-top: 15px; display: block; color: #444; font-size: 0.9rem; }
        input, select { padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 1rem; outline: none; }
        button { margin-top: 25px; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: 0.3s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #pinModal, #customPromptModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 100%; max-width: 320px; text-align: center; }
        .pin-input { font-size: 2rem; text-align: center; letter-spacing: 10px; width: 100%; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; }
        .cancel-btn { background: #f44336; margin-top: 10px; width: 100%; padding: 10px; color: white; border: none; border-radius: 8px; cursor: pointer; }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="mainContent">
    <a href="../home.html" style="color: var(--primary); text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 10px;">← Back to Dashboard</a>
    <div class="card">
        <h2>📶 Data Subscription</h2>
        <div id="statusMsg"></div>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. 08123456789" list="recentNumbers" autocomplete="off" oninput="autoLookupNetwork()">
        <datalist id="recentNumbers"></datalist>

        <label>Select Network</label>
        <select id="network" onchange="updateDataTypes()">
            <option value="">Choose Network</option>
            <option value="mtn">MTN</option>
            <option value="glo">Glo</option>
            <option value="airtel">Airtel</option>
            <option value="9mobile">9mobile</option>
        </select>

        <label>Data Type</label>
        <select id="dataType" onchange="updateDataPlans()"><option value="">Choose Data Type</option></select>

        <label>Data Plan</label>
        <select id="variation"><option value="">Choose Plan</option></select>

        <button id="buyBtn" onclick="validateUserAndOpenModal()">Subscribe Now</button>
    </div>
</div>

<div id="pinModal">
    <div class="modal-content">
        <h3>Enter PIN</h3>
        <div id="pinError" style="color: red; font-size: 0.8rem; margin-bottom: 5px;"></div>
        <input type="password" id="txnPin" class="pin-input" maxlength="4" placeholder="••••" inputmode="numeric" autocomplete="off">
        <button onclick="togglePinVisibility()" id="toggleBtn" style="background: #6c757d; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">Show PIN</button>

        <div id="processingSpinner" class="spinner"></div>

        <button id="confirmBtn" onclick="verifyAndPay()" style="background: var(--primary); color: white; width:100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer;">Confirm Payment</button>
        <button class="cancel-btn" onclick="closePinModal()">Cancel</button>
    </div>
</div>

<div id="customPromptModal">
    <div class="modal-content">
        <h3 style="color: #0D47A1; margin-bottom: 10px;">Transaction PIN Required</h3>
        <p style="font-size: 0.95rem; color: #555; line-height: 1.4; margin-bottom: 20px;">
            You have not set up your transaction PIN yet. Would you like to set it up now to proceed with your transaction?
        </p>
        <button onclick="redirectToPinSetup()" style="background: var(--primary); color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px;">Yes</button>
        <button onclick="closeCustomPrompt()" style="background: #f44336; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">No</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="plans.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAXWh3ls4yEANmGy4g7xZ8jlBN0KoFC5yc", authDomain: "dnezerlinks.firebaseapp.com", databaseURL: "https://dnezerlinks-default-rtdb.firebaseio.com", projectId: "dnezerlinks", appId: "1:1028450580168:web:d7a48462a128f02aa657fd" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();
    const networkMap = { "mtn": "1", "glo": "2", "9mobile": "3", "airtel": "4" };

    window.onload = function() {
        loadRecentPhones();
        var pending = sessionStorage.getItem('pending_data_order');
        if (pending) {
            var order = JSON.parse(pending);
            document.getElementById('phone').value = order.phone;
            document.getElementById('network').value = order.network;
            updateDataTypes();
            document.getElementById('dataType').value = order.dataType;
            updateDataPlans();
            document.getElementById('variation').value = order.variation;
            sessionStorage.removeItem('pending_data_order');
            setTimeout(function() { document.getElementById('pinModal').style.display = 'flex'; }, 800);
        }
    };

    function loadRecentPhones() {
        var phones = JSON.parse(localStorage.getItem('recent_phones') || '[]');
        document.getElementById('recentNumbers').innerHTML = phones.map(function(p) { return '<option value="' + p + '">'; }).join('');
    }

    function saveRecentPhone(phone) {
        var phones = JSON.parse(localStorage.getItem('recent_phones') || '[]');
        if (!phones.includes(phone)) {
            phones = [phone].concat(phones).slice(0, 5);
            localStorage.setItem('recent_phones', JSON.stringify(phones));
            loadRecentPhones();
        }
    }

    function showMessage(msg, isError) {
        if (isError === undefined) isError = true;
        var msgDiv = document.getElementById('statusMsg');
        msgDiv.textContent = msg;
        msgDiv.style.display = 'block';
        msgDiv.className = isError ? 'error-msg' : 'success-msg';
    }

    function autoLookupNetwork() {
        var phone = document.getElementById('phone').value.trim();
        if (phone.length >= 4) {
            var prefix = phone.substring(0, 4);
            var networks = {
                'mtn': ['0803', '0806', '0810', '0813', '0814', '0816', '0703', '0706', '0903', '0906', '0913', '0916', '0702', '0704', '0707'],
                'glo': ['0805', '0807', '0811', '0815', '0705', '0905', '0915'],
                'airtel': ['0802', '0808', '0812', '0701', '0708', '0901', '0902', '0904', '0907', '0912', '0911'],
                '9mobile': ['0809', '0817', '0818', '0908', '0909']
            };
            for (var name in networks) {
                if (networks[name].includes(prefix)) {
                    document.getElementById('network').value = name;
                    updateDataTypes();
                    break;
                }
            }
        }
    }

    function updateDataTypes() {
        var network = document.getElementById('network').value;
        var dataTypeSelect = document.getElementById('dataType');
        dataTypeSelect.innerHTML = '<option value="">Choose Data Type</option>';

        if (network && window.groupedPlans && window.groupedPlans[network]) {
            var durations = {};

            Object.values(window.groupedPlans[network]).forEach(function(plans) {
                plans.forEach(function(plan) {
                    var dur = window.extractDuration(plan.name);
                    durations[dur] = true;
                });
            });

            var sorted = Object.keys(durations).sort(function(a, b) {
                return (parseInt(a) || 999) - (parseInt(b) || 999);
            });

            sorted.forEach(function(d) {
                dataTypeSelect.add(new Option(d, d));
            });
        }
        updateDataPlans();
    }

    function updateDataPlans() {
        var network = document.getElementById('network').value;
        var duration = document.getElementById('dataType').value;
        var variationSelect = document.getElementById('variation');
        variationSelect.innerHTML = '<option value="">Choose Plan</option>';

        if (network && duration && window.groupedPlans && window.groupedPlans[network]) {
            var matching = [];

            Object.values(window.groupedPlans[network]).forEach(function(plans) {
                plans.forEach(function(plan) {
                    if (window.extractDuration(plan.name) === duration) {
                        matching.push(plan);
                    }
                });
            });

            // Sort by price
            matching.sort(function(a, b) { return a.price - b.price; });

            matching.forEach(function(plan) {
                // SAFE string construction (no template literals)
                var cleanName = plan.name.split(' - ₦')[0];
                var displayName = cleanName + ' - ₦' + plan.price;
                variationSelect.add(new Option(displayName, JSON.stringify(plan)));
            });
        }
    }

    async function validateUserAndOpenModal() {
        var btn = document.getElementById('buyBtn');
        var user = auth.currentUser;
        var phone = document.getElementById('phone').value;
        var network = document.getElementById('network').value;
        var variation = document.getElementById('variation').value;

        if (!network || !variation || phone.length < 11) return showMessage("Please fill all fields.");

        btn.disabled = true;
        btn.textContent = "Checking...";
        try {
            var snap = await database.ref('users/' + user.uid).once('value');
            var data = snap.val() || {};

            if (!data.transaction_pin && !data.pin) {
                sessionStorage.setItem('pending_data_order', JSON.stringify({
                    phone: phone,
                    network: network,
                    dataType: document.getElementById('dataType').value,
                    variation: variation
                }));
                document.getElementById('customPromptModal').style.display = 'flex';
                return;
            }
            document.getElementById('pinModal').style.display = 'flex';
        } catch (e) {
            showMessage("Error validating.");
        } finally {
            btn.disabled = false;
            btn.textContent = "Subscribe Now";
        }
    }

    function redirectToPinSetup() {
        window.location.href = "../pinsetup.html?return=data";
    }

    function closeCustomPrompt() {
        document.getElementById('customPromptModal').style.display = 'none';
    }

    function togglePinVisibility() {
        var pinInput = document.getElementById('txnPin');
        var btn = document.getElementById('toggleBtn');
        pinInput.type = (pinInput.type === "password") ? "text" : "password";
        btn.textContent = (pinInput.type === "password") ? "Show PIN" : "Hide PIN";
    }

    async function verifyAndPay() {
        var btn = document.getElementById('confirmBtn');
        var pin = document.getElementById('txnPin').value;
        var user = auth.currentUser;
        var pinError = document.getElementById('pinError');
        var spinner = document.getElementById('processingSpinner');

        if (pin.length < 4) {
            pinError.textContent = "Enter 4 digits";
            return;
        }

        btn.disabled = true;
        btn.style.display = 'none';
        spinner.style.display = 'block';
        pinError.textContent = "";

        try {
            var snap = await database.ref('users/' + user.uid).once('value');
            var userData = snap.val() || {};
            if (pin === String(userData.transaction_pin || userData.pin || '')) {
                executePurchase(userData.balance, user.uid, JSON.parse(document.getElementById('variation').value));
            } else {
                pinError.textContent = "Incorrect PIN!";
                btn.disabled = false;
                btn.style.display = 'inline-block';
                spinner.style.display = 'none';
            }
        } catch (e) {
            pinError.textContent = "Validation error.";
            btn.disabled = false;
            btn.style.display = 'inline-block';
            spinner.style.display = 'none';
        }
    }

    async function executePurchase(balance, uid, plan) {
        var btn = document.getElementById('confirmBtn');
        var phone = document.getElementById("phone").value;
        var spinner = document.getElementById('processingSpinner');

        if (balance < plan.price) {
            showMessage("Insufficient Balance");
            closePinModal();
            return;
        }
        try {
            var res = await fetch("https://dnezerlinks-backend.onrender.com/api/data/buy", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    pin: document.getElementById("txnPin").value,
                    uid: uid,
                    phone: phone,
                    dataPlan: plan.id,
                    networkID: networkMap[document.getElementById("network").value],
                    amount: plan.price
                })
            });
            var data = await res.json();
            if (data.success) {
                saveRecentPhone(phone);
                closePinModal();
                showMessage("Success!", false);
                document.getElementById('phone').value = '';
                setTimeout(function() { window.location.href = "../home.html"; }, 2000);
            } else {
                throw new Error(data.error || "Failed");
            }
        } catch (e) {
            showMessage(e.message || "Error processing transaction.");
            closePinModal();
        } finally {
            btn.disabled = false;
            btn.style.display = 'inline-block';
            spinner.style.display = 'none';
        }
    }

    function closePinModal() {
        document.getElementById('pinModal').style.display = 'none';
        document.getElementById('txnPin').value = '';
        document.getElementById('pinError').textContent = '';
        document.getElementById('confirmBtn').style.display = 'inline-block';
        document.getElementById('processingSpinner').style.display = 'none';
    }

    auth.onAuthStateChanged(function(user) {
        if (!user) window.location.href = "../login.html";
    });
</script>
</body>
</html>
